openapi: 3.0.3
info:
  title: HOSOM HELMS Phase 1 API
  version: 1.0.0
  description: >-
    Phase 1 API for authentication, student records, programme and course setup,
    enrolment, learning materials, and assignment/submission workflows. See
    api-requirements-mapping.md for the complete implementation status and gaps.
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: API liveness
      responses:
        '200': { description: API process is running }
  /ready:
    get:
      security: []
      summary: Database readiness
      responses:
        '200': { description: Database is ready }
        '503': { description: Database is unavailable }
  /api/auth/roles:
    get:
      security: []
      summary: List supported system roles
      responses:
        '200': { description: Role list }
  /api/auth/login:
    post:
      security: []
      summary: Authenticate a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200': { description: Authenticated user and bearer token }
        '401': { description: Invalid credentials }
  /api/auth/me:
    get:
      summary: Return the authenticated user's profile
      responses:
        '200': { description: Current user profile }
        '401': { description: Missing or invalid token }
  /api/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
  /api/students/register:
    post:
      security: []
      summary: Public student registration; creates a PENDING student record
      responses:
        '201': { description: Student registration and initial session created }
        '409': { description: Duplicate email or student number }
  /api/students:
    get:
      summary: Search and list student records
      responses:
        '200': { description: Paginated student records }
    post:
      summary: Create a student record (authorized staff)
      responses:
        '201': { description: Student created with unique student ID }
  /api/programs:
    get:
      security: []
      summary: List programmes
      responses:
        '200': { description: Programme catalogue }
    post:
      summary: Create a programme
      responses:
        '201': { description: Programme created }
  /api/courses:
    get:
      summary: List courses visible to the authenticated user
      responses:
        '200': { description: Course list }
    post:
      summary: Create a course
      responses:
        '201': { description: Course created }
  /api/enrollments/me:
    get:
      summary: List the authenticated student's own enrolments
      responses:
        '200': { description: Enrolments for the current student }
  /api/enrollments:
    get:
      summary: List enrolments permitted to the authenticated role
      responses:
        '200': { description: Enrolment records }
    post:
      summary: Enrol an active student into an active course
      responses:
        '201': { description: Enrolment created }
        '400': { description: Student or course is not active }
        '409': { description: Duplicate enrolment }
  /api/materials:
    get:
      summary: List learning materials visible to the authenticated user
      responses:
        '200': { description: Paginated materials }
    post:
      summary: Create course learning material metadata/content
      responses:
        '201': { description: Material created }
  /api/assignments:
    get:
      summary: List assignments visible to the authenticated user
      responses:
        '200': { description: Paginated assignments }
    post:
      summary: Create an assignment for an assigned course
      responses:
        '201': { description: Assignment created }
  /api/assignments/{id}/submissions:
    post:
      summary: Submit an assignment as the enrolled student
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Submission saved }
        '403': { description: Student is not enrolled in the course }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
